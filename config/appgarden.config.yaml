# App Garden runtime configuration for Kamiwaza Flow.
#
# This file is intentionally non-secret and avoids hard-coding local deployment
# model routes. Kamiwaza models are discovered from the local OpenAI-compatible
# proxy at runtime.

config_version: 7
log_level: info

token_usage:
  enabled: false

model_list_endpoint:
  enabled: true
  url: http://host.docker.internal:4000/v1/models
  cache_ttl_sec: 30
  use: langchain_openai:ChatOpenAI
  provider: kamiwaza
  base_url: http://host.docker.internal:4000/v1
  api_key: "n/a"
  timeout: 1200.0
  timeout_sec: 60.0
  max_retries: 2
  disable_streaming: tool_calling
  supports_thinking: true
  supports_vision: false
  supports_reasoning_effort: false

models: []

tools:
  - name: web_search
    group: web
    use: deerflow.community.ddg_search.tools:web_search_tool
    max_results: 5

  - name: web_fetch
    group: web
    use: deerflow.community.jina_ai.tools:web_fetch_tool
    timeout: 10

  - name: image_search
    group: web
    use: deerflow.community.image_search.tools:image_search_tool
    max_results: 5

tool_search:
  enabled: false

uploads:
  pdf_converter: auto

sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider
  allow_host_bash: false
  bash_output_max_chars: 20000
  read_file_output_max_chars: 50000
  ls_output_max_chars: 20000

title:
  enabled: true
  max_words: 6
  max_chars: 60
  model_name: null

summarization:
  enabled: true
  model_name: null
  trigger:
    - type: tokens
      value: 15564
  keep:
    type: messages
    value: 10
  trim_tokens_to_summarize: 15564
  summary_prompt: null

memory:
  enabled: true
  storage_path: memory.json
  debounce_seconds: 30
  model_name: null
  max_facts: 100
  fact_confidence_threshold: 0.7
  injection_enabled: true
  max_injection_tokens: 2000

agents_api:
  enabled: false

skill_evolution:
  enabled: false
  moderation_model_name: null

checkpointer:
  type: sqlite
  connection_string: checkpoints.db

circuit_breaker:
  failure_threshold: 5
  recovery_timeout_sec: 60
