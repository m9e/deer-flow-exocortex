services:
  gateway:
    image: ghcr.io/kamiwaza-internal/deer-flow-exocortex/images/kamiwaza-flow-backend:0.1.0
    x-kamiwaza:
      containerSecurityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        readOnlyRootFilesystem: false
    command: sh -c "cd backend && PYTHONPATH=. uv run --no-sync uvicorn app.gateway.app:app --host 0.0.0.0 --port 8001 --workers ${GATEWAY_WORKERS:-1}"
    ports:
      - "8001"
    environment:
      CI: "true"
      DEER_FLOW_HOME: /app/backend/.deer-flow
      DEER_FLOW_CONFIG_PATH: /app/config/config.yaml
      DEER_FLOW_EXTENSIONS_CONFIG_PATH: /app/config/appgarden.extensions_config.json
      DEER_FLOW_CHANNELS_LANGGRAPH_URL: http://langgraph:2024
      DEER_FLOW_CHANNELS_GATEWAY_URL: http://gateway:8001
      KAMIWAZA_API_URL: ${KAMIWAZA_API_URL:-https://host.docker.internal/api}
      KAMIWAZA_API_KEY: ${KAMIWAZA_API_KEY:-}
      KAMIWAZA_PUBLIC_API_URL: ${KAMIWAZA_PUBLIC_API_URL:-https://localhost/api}
      KAMIWAZA_TOOL_DISCOVERY_ENABLED: ${KAMIWAZA_TOOL_DISCOVERY_ENABLED:-true}
      KAMIWAZA_TOOL_DISCOVERY_ENDPOINT_MODE: ${KAMIWAZA_TOOL_DISCOVERY_ENDPOINT_MODE:-auto}
      KAMIWAZA_VERIFY_SSL: ${KAMIWAZA_VERIFY_SSL:-false}
      MCP_VERIFY_SSL: ${MCP_VERIFY_SSL:-false}
      GATEWAY_WORKERS: ${GATEWAY_WORKERS:-1}
    extra_hosts:
      - host.docker.internal:host-gateway
      - toolshed.default.deployment.kamiwaza.ai:host-gateway
    volumes:
      - app-kamiwaza-flow-data:/app/backend/.deer-flow
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5).read()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2G
        reservations:
          cpus: "0.05"
          memory: 512M

  langgraph:
    image: ghcr.io/kamiwaza-internal/deer-flow-exocortex/images/kamiwaza-flow-backend:0.1.0
    x-kamiwaza:
      containerSecurityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        readOnlyRootFilesystem: false
    command: sh -c 'cd /app/backend && args="--no-browser --no-reload --host 0.0.0.0 --port 2024 --n-jobs-per-worker $${LANGGRAPH_JOBS_PER_WORKER:-4}" && if [ "$${LANGGRAPH_ALLOW_BLOCKING:-1}" = "1" ]; then args="$$args --allow-blocking"; fi && uv run --no-sync langgraph dev $$args'
    ports:
      - "2024"
    environment:
      CI: "true"
      DEER_FLOW_HOME: /app/backend/.deer-flow
      DEER_FLOW_CONFIG_PATH: /app/config/config.yaml
      DEER_FLOW_EXTENSIONS_CONFIG_PATH: /app/config/appgarden.extensions_config.json
      DEER_FLOW_AGENTS_API_BASE_URL: http://gateway:8001
      DEER_FLOW_AGENTS_API_TIMEOUT_SECONDS: ${DEER_FLOW_AGENTS_API_TIMEOUT_SECONDS:-5.0}
      DEER_FLOW_MEMORY_API_BASE_URL: http://gateway:8001
      DEER_FLOW_MEMORY_API_TIMEOUT_SECONDS: ${DEER_FLOW_MEMORY_API_TIMEOUT_SECONDS:-5.0}
      KAMIWAZA_API_URL: ${KAMIWAZA_API_URL:-https://host.docker.internal/api}
      KAMIWAZA_API_KEY: ${KAMIWAZA_API_KEY:-}
      KAMIWAZA_PUBLIC_API_URL: ${KAMIWAZA_PUBLIC_API_URL:-https://localhost/api}
      KAMIWAZA_TOOL_DISCOVERY_ENABLED: ${KAMIWAZA_TOOL_DISCOVERY_ENABLED:-true}
      KAMIWAZA_TOOL_DISCOVERY_ENDPOINT_MODE: ${KAMIWAZA_TOOL_DISCOVERY_ENDPOINT_MODE:-auto}
      KAMIWAZA_VERIFY_SSL: ${KAMIWAZA_VERIFY_SSL:-false}
      MCP_VERIFY_SSL: ${MCP_VERIFY_SSL:-false}
      LANGGRAPH_ALLOW_BLOCKING: ${LANGGRAPH_ALLOW_BLOCKING:-1}
      LANGGRAPH_JOBS_PER_WORKER: ${LANGGRAPH_JOBS_PER_WORKER:-4}
    extra_hosts:
      - host.docker.internal:host-gateway
      - toolshed.default.deployment.kamiwaza.ai:host-gateway
    volumes:
      - app-kamiwaza-flow-data:/app/backend/.deer-flow
      - app-kamiwaza-flow-langgraph-api:/app/backend/.langgraph_api
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:2024/ok', timeout=5).read()"
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
        reservations:
          cpus: "0.05"
          memory: 768M

  frontend:
    image: ghcr.io/kamiwaza-internal/deer-flow-exocortex/images/kamiwaza-flow-frontend:0.1.0
    x-kamiwaza:
      containerSecurityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        readOnlyRootFilesystem: false
    depends_on:
      gateway:
        condition: service_healthy
      langgraph:
        condition: service_healthy
    ports:
      - "3000"
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-deer-flow-appgarden-local-secret}
      DEER_FLOW_INTERNAL_GATEWAY_BASE_URL: http://gateway:8001
      DEER_FLOW_INTERNAL_LANGGRAPH_BASE_URL: http://langgraph:2024
      NEXT_BUILD_MAX_OLD_SPACE_SIZE: ${NEXT_BUILD_MAX_OLD_SPACE_SIZE:-1536}
      KAMIWAZA_PUBLIC_API_URL: ${KAMIWAZA_PUBLIC_API_URL:-https://localhost/api}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const p=process.env.KAMIWAZA_APP_PATH||'';require('http').get('http://localhost:3000'+p,(r)=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 180s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 3G
        reservations:
          cpus: "0.05"
          memory: 512M
    extra_hosts:
      - host.docker.internal:host-gateway
      - toolshed.default.deployment.kamiwaza.ai:host-gateway

volumes:
  app-kamiwaza-flow-data:
  app-kamiwaza-flow-langgraph-api:
